# Production: deployed by Argo CD from main of this repo (argocd/project-production-app.yaml
# in the source repo). When a v* tag is pushed to the source repo, its CI bumps the images
# block in this file; a plain push to the source repo's main never touches it.
#
# Not in git, created by hand in the "production" namespace:
#   postgres-secret     POSTGRES_PASSWORD
#   broadcaster-secret  WEBHOOK_URL, WEBHOOK_FORMAT (generic|discord)
#   backup-config       BACKUP_BUCKET (bucket name, without gs://)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
# Only production backs up the database.
resources:
- ../../base
- backup-serviceaccount.yaml
- backup-cronjob.yaml

images:
- name: broadcaster
  newName: europe-north1-docker.pkg.dev/dwk-gke-509508/dwk-repo/broadcaster
  newTag: v1.0.4
- name: todo-backend
  newName: europe-north1-docker.pkg.dev/dwk-gke-509508/dwk-repo/backend
  newTag: v1.0.4
- name: todo-frontend
  newName: europe-north1-docker.pkg.dev/dwk-gke-509508/dwk-repo/frontend
  newTag: v1.0.4
