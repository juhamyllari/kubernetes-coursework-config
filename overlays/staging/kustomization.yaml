# Staging: deployed by Argo CD from main of this repo (argocd/project-staging-app.yaml in the source repo).
# The source repo's CI workflow rewrites the images block on each push to its main.
#
# Not in git, created by hand in the "staging" namespace:
#   postgres-secret     POSTGRES_PASSWORD
# There is no broadcaster-secret and no backup in staging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
- ../../base

# The broadcaster gets no WEBHOOK_URL, so it only logs the messages
# and forwards nothing to an external service.
patches:
- patch: |-
    - op: remove
      path: /spec/template/spec/containers/0/envFrom
  target:
    kind: Deployment
    name: broadcaster-dep

images:
- name: broadcaster
  newName: europe-north1-docker.pkg.dev/dwk-gke-509508/dwk-repo/broadcaster
  newTag: 8e44336e9b460b037b4f716dbfa2ca27aa7ff8b1
- name: todo-backend
  newName: europe-north1-docker.pkg.dev/dwk-gke-509508/dwk-repo/backend
  newTag: 8e44336e9b460b037b4f716dbfa2ca27aa7ff8b1
- name: todo-frontend
  newName: europe-north1-docker.pkg.dev/dwk-gke-509508/dwk-repo/frontend
  newTag: 8e44336e9b460b037b4f716dbfa2ca27aa7ff8b1
